# Rendered by the nginx image at start: only ${API_UPSTREAM} is replaced; the nginx variables
# ($uri, $host...) stay as they are.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Docker's own DNS. The API address is resolved on each request (the variable below), so nginx
  # starts even when the back is down and follows it when its container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # /api/x on the browser is /x on the back-end, same origin: no CORS involved.
  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The browser sends Origin on POST/PATCH/DELETE even on the same origin. Seen by Spring behind
    # this proxy it looks cross-origin, and its CORS filter answers 403. Without Origin it is a
    # plain request.
    proxy_set_header Origin "";
    proxy_read_timeout 60s;
  }

  # The files that decide which version runs are never cached; the hashed assets, for a year.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # React Router routes: every other path is the app.
  location / {
    try_files $uri /index.html;
  }
}
