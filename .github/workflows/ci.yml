name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright, real back-end in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The back's compose is started as project "personalbudget", so its network is the one the
      # front's docker-compose.yml joins by default.
      BACK_PROJECT: personalbudget
    steps:
      - uses: actions/checkout@v5

      # The back-end is public: no token needed. `master` is what runs at home.
      - uses: actions/checkout@v5
        with:
          repository: brunosilvaJava/personalbudget
          ref: master
          path: back

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Pin the Gradle image of the back's Dockerfile
        working-directory: back
        run: |
          # `gradle:jdk21` now means Gradle 9, and the back (Gradle 8.6 in the wrapper, Spring
          # Dependency Management 1.1.4) does not build on it: "Failed to notify dependency
          # resolution listener". Drop this step when the back's Dockerfile pins the image itself.
          if grep -q '^FROM gradle:jdk21' Dockerfile; then
            sed -i 's|^FROM gradle:jdk21 as gradle|FROM gradle:8.6-jdk21 AS gradle|' Dockerfile
          fi
          head -3 Dockerfile

      - name: Start the back-end (MySQL + API, empty database)
        working-directory: back
        run: docker compose -p "$BACK_PROJECT" --profile app up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "The API did not come up in 5 minutes"
          exit 1

      - name: Start the front-end (nginx on port 3000)
        run: docker compose up -d --build

      - name: Wait for the front-end and its /api proxy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "http://localhost:3000/api did not answer"
          exit 1

      - name: Contract (contracts.ts x the back's OpenAPI)
        run: npm run check:contract -- http://localhost:3000/api/v3/api-docs

      - run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e

      - name: Logs
        if: failure()
        run: |
          docker ps -a || true
          echo "::group::front"
          docker compose logs --no-color --tail 200 || true
          echo "::endgroup::"
          echo "::group::back"
          docker compose -p "$BACK_PROJECT" -f back/docker-compose.yml --profile app logs --no-color --tail 400 || true
          echo "::endgroup::"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
